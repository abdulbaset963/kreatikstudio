  <div class="project-lightbox" id="projectLightbox" aria-hidden="true">

    <div class="lightbox-stage">
      <img id="lightboxImage" src="" alt="Noor Coffee" draggable="false">
    </div>
    <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="الصورة التالية">›</button>
    <div class="lightbox-toolbar" aria-label="أدوات تكبير الصورة">
      <button type="button" id="lightboxZoomOut" aria-label="تصغير">−</button>
      <span id="lightboxZoomValue">100%</span>
      <button type="button" id="lightboxZoomIn" aria-label="تكبير">+</button>
      <button type="button" id="lightboxZoomReset" aria-label="إعادة الحجم">إعادة</button>

    </div>

  <footer class="project-page-footer">

    <a class="project-page-back" href="index.html#work" data-en="Back to selected work" data-ar="العودة إلى الأعمال المختارة">العودة إلى الأعمال المختارة</a>
  </footer>

<script>
(function(){
  const savedLang = localStorage.getItem('kreatik-lang') || 'ar';
  const applyLang = (lang) => {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-en][data-ar]').forEach(el => { el.textContent = el.getAttribute('data-' + lang); });
  };
  applyLang(savedLang);

  const frames = [...document.querySelectorAll('.project-image-frame img')];
  const lightbox = document.getElementById('projectLightbox');
  const lbImg = document.getElementById('lightboxImage');
  const count = document.getElementById('lightboxCount');
  const zoomValue = document.getElementById('lightboxZoomValue');
  let current = 0, zoom = 1;

  function renderZoom(){
    lbImg.style.transform = 'scale(' + zoom + ')';
    zoomValue.textContent = Math.round(zoom * 100) + '%';
  }
  function openAt(index){
    current = (index + frames.length) % frames.length;
    lbImg.src = frames[current].currentSrc || frames[current].src;
    lbImg.alt = frames[current].alt;
    count.textContent = String(current + 1).padStart(2,'0') + ' / ' + String(frames.length).padStart(2,'0');
    zoom = 1; renderZoom();
    lightbox.classList.add('is-open');
    lightbox.setAttribute('aria-hidden','false');
    document.body.classList.add('lightbox-open');
  }
  function close(){
    lightbox.classList.remove('is-open');
    lightbox.setAttribute('aria-hidden','true');
    document.body.classList.remove('lightbox-open');
    lbImg.src='';
  }
  function step(dir){ openAt(current + dir); }
  frames.forEach((img,i)=>{
    img.addEventListener('click',()=>openAt(i));
    img.addEventListener('dragstart',e=>e.preventDefault());
  });
  document.getElementById('lightboxClose').addEventListener('click',close);
  document.getElementById('lightboxPrev').addEventListener('click',()=>step(-1));
  document.getElementById('lightboxNext').addEventListener('click',()=>step(1));
  document.getElementById('lightboxZoomIn').addEventListener('click',()=>{ zoom=Math.min(2.5,Math.round((zoom+.1)*10)/10); renderZoom(); });
  document.getElementById('lightboxZoomOut').addEventListener('click',()=>{ zoom=Math.max(.5,Math.round((zoom-.1)*10)/10); renderZoom(); });
  document.getElementById('lightboxZoomReset').addEventListener('click',()=>{zoom=1;renderZoom();});
  lightbox.addEventListener('click',e=>{ if(e.target===lightbox || e.target.classList.contains('lightbox-stage')) close(); });
  document.addEventListener('contextmenu',e=>{
    if(e.target.closest('.project-page-gallery img') || e.target.closest('.project-lightbox img')) e.preventDefault();
  });
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey) && ['s','u','p'].includes(e.key.toLowerCase())) e.preventDefault();
    if(!lightbox.classList.contains('is-open')) return;
    if(e.key==='Escape') close();
    if(e.key==='ArrowLeft') step(document.documentElement.dir==='rtl' ? 1 : -1);
    if(e.key==='ArrowRight') step(document.documentElement.dir==='rtl' ? -1 : 1);
    if(e.key==='+' || e.key==='='){zoom=Math.min(2.5,Math.round((zoom+.1)*10)/10);renderZoom();}
    if(e.key==='-'){zoom=Math.max(.5,Math.round((zoom-.1)*10)/10);renderZoom();}
    if(e.key==='0'){zoom=1;renderZoom();}
  });
})();
</script>
